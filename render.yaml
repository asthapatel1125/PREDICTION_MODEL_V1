services:
  - type: web
    name: axiom-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: AXIOM_ENVIRONMENT
        value: production
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: AXIOM_CORS_ORIGINS
        sync: false
      - key: THETADATA_API_KEY
        sync: false
      - key: AXIOM_THETADATA_TRANSPORT
        value: python
      - key: AXIOM_THETADATA_MAX_DTE
        value: "7"
      - key: AXIOM_THETADATA_STRIKE_RANGE
        value: "30"
