version: 1.1.0-session-weights
timeframes_seconds: [5, 10, 30, 60, 180, 300, 900]
primary_timeframe_seconds: 60
regime_timeframe_seconds: 300
score_history: 250
evaluation_horizon_bars: 12
max_lead_seconds: 600
profiles:
  NEWS: { explosion_min: 0.74, direction_min: 3, confidence_min: 0.78, micro_range_minutes: 3, require_breakout: true, expected_move_vol_multiple: 1.7 }
  MARKET_OPEN: { explosion_min: 0.66, direction_min: 2, confidence_min: 0.72, micro_range_minutes: 5, require_breakout: true, expected_move_vol_multiple: 1.35 }
  NORMAL_SESSION: { explosion_min: 0.58, direction_min: 2, confidence_min: 0.68, micro_range_minutes: 8, require_breakout: true, expected_move_vol_multiple: 1.0 }
  POWER_HOUR: { explosion_min: 0.61, direction_min: 2, confidence_min: 0.70, micro_range_minutes: 6, require_breakout: true, expected_move_vol_multiple: 1.2 }
  OVERNIGHT: { explosion_min: 0.72, direction_min: 3, confidence_min: 0.80, micro_range_minutes: 12, require_breakout: true, expected_move_vol_multiple: 1.5 }
regime_thresholds:
  CALM: { explosion_max: 0.38 }
  EXPANSION: { explosion_min: 0.58, slope_min: 0.02 }
  GAMMA_UNSTABLE: { gamma_cv_min: 1.7, sign_flips_min: 2 }
  HEDGING_ACTIVE: { hedging_min: 1.3 }
  HIGH_VOLATILITY_EVENT: { vol_ratio_min: 2.5 }
  LOW_LIQUIDITY: { spread_ratio_min: 2.0, volume_ratio_max: 0.35 }
  TRENDING: { efficiency_min: 0.68 }
  CHOPPY: { efficiency_max: 0.28 }
score_weights:
  explosion: { vomma: 0.16, ultima: 0.18, veta: 0.10, gamma: 0.13, speed: 0.13, zomma: 0.11, color: 0.11, charm: 0.08 }
  confidence: { explosion: 0.30, direction: 0.25, pressure: 0.20, momentum: 0.10, timeframe: 0.15 }
session_model:
  transition_threshold: 0.60
  separation_threshold: 0.15
  persistence_bars: 3
  minimum_confirmations: 2
  # Add YYYY-MM-DD dates here when the exchange has a 1:00 p.m. Eastern close.
  # This explicit list is deterministic and avoids inventing a holiday calendar.
  early_close_dates: []
  windows:
    OPENING: ["09:30", "10:45"]
    LATE_MORNING: ["10:00", "12:30"]
    LUNCH: ["11:30", "14:30"]
    AFTERNOON: ["13:30", "15:15"]
    POWER_HOUR: ["14:45", "16:00"]
  transition_weights:
    OPENING: { gamma: 0.35, vanna: 0.35, charm: 0.10, confirmation: 0.20 }
    LATE_MORNING: { gamma: 0.45, vanna: 0.20, charm: 0.25, confirmation: 0.10 }
    LUNCH: { gamma: 0.25, vanna: 0.10, charm: 0.45, confirmation: 0.20 }
    AFTERNOON: { gamma: 0.40, vanna: 0.15, charm: 0.25, confirmation: 0.20 }
    POWER_HOUR: { gamma: 0.40, vanna: 0.05, charm: 0.35, confirmation: 0.20 }
  active_weights:
    OPENING: { gamma: 0.45, vanna: 0.35, charm: 0.20 }
    LATE_MORNING: { gamma: 0.55, vanna: 0.20, charm: 0.25 }
    LUNCH: { gamma: 0.35, vanna: 0.15, charm: 0.50 }
    AFTERNOON: { gamma: 0.50, vanna: 0.20, charm: 0.30 }
    POWER_HOUR: { gamma: 0.50, vanna: 0.10, charm: 0.40 }
risk_limits: { max_spread_ratio: 2.5, max_vol_ratio: 3.5, min_liquidity_score: 0.35, max_signal_risk: 0.72 }
