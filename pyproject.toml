[project]
name = "axiom-pressure-platform"
version = "1.0.0"
description = "Institutional options-Greeks pressure analytics platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "httpx>=0.27,<1",
  "numpy>=2.1,<3", "pandas>=2.2,<3", "PyYAML>=6.0,<7",
  "structlog>=24.4,<26", "prometheus-client>=0.21,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pytest-cov>=6,<7", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["axiom"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/axiom"]
